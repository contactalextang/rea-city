<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REA City</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas.game { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); user-select: none; }
    .hud-tl { position: absolute; left: 16px; top: 14px; font-size: 14px; line-height: 1.5; }
    .hud-tr { position: absolute; right: 16px; top: 14px; text-align: right; }
    .money { font-size: 24px; font-weight: 700; color: #7ee787; letter-spacing: 1px; }
    .stars { font-size: 22px; letter-spacing: 3px; margin-top: 2px; }
    .stars .on { color: #ffd33d; }
    .stars .off { color: rgba(255,255,255,.25); }
    .law { font-size: 12px; opacity: .85; margin-top: 2px; color: #ffb4b4; }
    .health { width: 180px; height: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.5); border-radius: 5px; overflow: hidden; margin-top: 6px; }
    .health > div { height: 100%; width: 100%; background: #ff5f5f; transition: width .15s; }
    .level { margin-top: 6px; font-size: 13px; font-weight: 700; color: #d8c4ff; letter-spacing: .5px; }
    .level .xpbar { width: 180px; height: 4px; background: rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; margin-top: 3px; }
    .level .xpbar > div { height: 100%; width: 0; background: #b48cff; transition: width .3s; }
    .level .nw { margin-left: 8px; font-weight: 600; color: #ffd98a; }
    .ach { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font-size: 16px; font-weight: 700; color: #fff; background: rgba(60,30,110,.8); border: 1px solid #b48cff; border-radius: 10px; padding: 8px 18px; opacity: 0; transition: opacity .3s; text-align: center; white-space: nowrap; }
    .ach.show { opacity: 1; }
    .clock { margin-top: 6px; font-size: 13px; opacity: .9; letter-spacing: .5px; }
    .speed { margin-top: 8px; font-size: 13px; opacity: .85; }
    .hud-bc { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); text-align: center; font-size: 16px; }
    .mission { background: rgba(0,0,0,.45); padding: 8px 16px; border-radius: 8px; display: inline-block; min-width: 260px; }
    .mission .title { font-weight: 700; color: #ffd33d; }
    .mission .timer { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .mission .timer:empty { display: none; }
    .mission .nav { margin-top: 3px; font-size: 16px; font-weight: 800; color: #ff2bd6; text-shadow: 0 1px 2px #000; }
    .mission .nav .arr { display: inline-block; margin-right: 6px; font-size: 18px; }
    .mission .qsub { font-size: 12px; opacity: .8; margin-top: 4px; color: #9fd3ff; border-top: 1px solid rgba(255,255,255,.15); padding-top: 4px; }
    .hint { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-size: 18px; font-weight: 600; padding: 6px 14px; background: rgba(0,0,0,.5); border-radius: 6px; opacity: 0; transition: opacity .2s; }
    .hint.show { opacity: 1; }
    #minimap { position: absolute; right: 16px; bottom: 16px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); background: #1a1f2e; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
    .toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 28px; font-weight: 800; color: #ffd33d; opacity: 0; transition: opacity .3s; text-align: center; }
    .toast.show { opacity: 1; }
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(5,8,20,.82); color: #fff; pointer-events: auto; transition: opacity .3s; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h1 { font-size: 56px; margin: 0 0 8px; letter-spacing: 4px; }
    .overlay h1.red { color: #ff5f5f; } .overlay h1.gold { color: #ffd33d; }
    .overlay p { margin: 4px 0; font-size: 16px; opacity: .9; }
    #ov-sub { white-space: pre-line; line-height: 1.6; }
    .overlay .keys { margin-top: 18px; display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-size: 15px; text-align: left; background: rgba(255,255,255,.06); padding: 16px 24px; border-radius: 10px; }
    .overlay kbd { display: inline-block; min-width: 18px; text-align: center; padding: 2px 7px; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; background: rgba(0,0,0,.4); font-family: inherit; font-size: 13px; }
    .overlay .go { margin-top: 24px; font-size: 18px; color: #7ee787; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .overlay .attrib { position: absolute; left: 16px; right: 16px; bottom: 12px; font-size: 11px; opacity: .55; text-align: center; white-space: pre-line; line-height: 1.5; }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; display: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000; }
    .crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    .crosshair::after { top: 8px; left: 0; width: 18px; height: 2px; }
    .crosshair.show { display: block; }
    .weapon { position: absolute; left: 16px; bottom: 34px; font-size: 13px; opacity: .85; display: none; }
    .weapon.show { display: block; }
    .debug { position: absolute; left: 16px; bottom: 14px; font-size: 11px; opacity: .55; font-family: Menlo, monospace; white-space: pre; }
    /* 低饥饿/低精力暗角 */
    .vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(10,0,0,.85) 100%); }
    .vignette.show { opacity: 1; }
    /* 交互面板 */
    .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); width: 380px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; background: rgba(8,12,26,.94); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 18px 20px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; font-family: inherit; }
    .panel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .panel h2 { margin: 0 24px 2px 0; font-size: 20px; letter-spacing: 1px; }
    .panel .sub { font-size: 12px; opacity: .7; margin-bottom: 8px; }
    .panel .lines { font-size: 13px; opacity: .9; line-height: 1.6; margin-bottom: 10px; }
    .panel .buttons { display: flex; flex-direction: column; gap: 6px; }
    .pbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 12px; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .pbtn:hover:not(:disabled) { background: rgba(126,231,135,.18); border-color: #7ee787; }
    .pbtn:disabled { opacity: .4; cursor: default; }
    .pbtn .note { font-size: 12px; opacity: .8; color: #7ee787; margin-left: 12px; white-space: nowrap; }
    .xbtn { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 16px; cursor: pointer; }
    .xbtn:hover { background: rgba(255,95,95,.5); }
    /* 手机抽屉 */
    .phone { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; max-width: 90vw; background: rgba(8,12,26,.94); color: #fff; border-left: 1px solid rgba(255,255,255,.15); box-shadow: -8px 0 30px rgba(0,0,0,.5); transform: translateX(100%); transition: transform .2s; pointer-events: none; overflow: auto; padding: 16px 18px 20px; box-sizing: border-box; font-family: inherit; }
    .phone.show { transform: translateX(0); pointer-events: auto; }
    .phone h2 { margin: 0 0 2px; font-size: 18px; letter-spacing: 2px; }
    .phone .ptime { font-size: 13px; opacity: .8; }
    .phone .pmoney { font-size: 26px; font-weight: 700; color: #7ee787; margin: 8px 0 2px; }
    .phone .prole { font-size: 13px; opacity: .85; }
    .phone .plaw { font-size: 12px; color: #ffb4b4; min-height: 16px; }
    .phone .bar { margin-top: 8px; font-size: 12px; }
    .phone .bar .track { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .phone .bar .fill { height: 100%; width: 50%; transition: width .3s; }
    .phone .bar.hunger .fill { background: #ff8c2e; }
    .phone .bar.energy .fill { background: #3ea6ff; }
    .phone .bar.low .fill { background: #ff4b4b; }
    .phone .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .phone .apps button, .phone .sub button { padding: 10px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .phone .apps button:hover, .phone .sub button:hover { background: rgba(126,231,135,.18); border-color: #7ee787; }
    .phone .apps button.danger:hover { background: rgba(255,95,95,.3); border-color: #ff5f5f; }
    .phone .sub { margin-top: 12px; display: none; }
    .phone .sub.show { display: block; }
    .phone .sub h3 { margin: 0 0 8px; font-size: 14px; opacity: .85; }
    .phone .sub .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .phone .sub .row button.on { background: rgba(126,231,135,.3); border-color: #7ee787; }
    .phone #phone-map { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #1a1f2e; }
    .phone .tip { font-size: 11px; opacity: .55; margin-top: 12px; }
    /* 工作页 */
    .phone .work .stat { font-size: 12px; opacity: .85; margin-bottom: 8px; line-height: 1.6; }
    .phone .work .quest { font-size: 12px; color: #9fd3ff; background: rgba(62,166,255,.1); border: 1px solid rgba(62,166,255,.3); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; line-height: 1.5; }
    .phone .job { border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: rgba(255,255,255,.04); }
    .phone .job.active { border-color: #7ee787; background: rgba(126,231,135,.1); }
    .phone .job.off { opacity: .5; }
    .phone .job .jt { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
    .phone .job .jd { font-size: 11px; opacity: .75; margin-top: 2px; line-height: 1.45; }
    .phone .job .js { font-size: 11px; color: #ffd33d; margin-top: 3px; }
    .phone .job button { padding: 4px 10px; font-size: 12px; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; font: inherit; }
    .phone .job button:hover { background: rgba(126,231,135,.25); border-color: #7ee787; }
    .phone .job button.stop { border-color: #ff5f5f; }
    .phone .job button.stop:hover { background: rgba(255,95,95,.3); }
    .phone .apps button.on { background: rgba(126,231,135,.25); border-color: #7ee787; }
    .phone .app .stat { font-size: 12px; opacity: .85; margin-bottom: 4px; line-height: 1.5; }
    .phone .app .sect { font-size: 12px; font-weight: 700; opacity: .7; letter-spacing: 1px; margin: 12px 0 6px; }
    .phone .app .empty { font-size: 13px; opacity: .7; padding: 18px 8px; text-align: center; border: 1px dashed rgba(255,255,255,.25); border-radius: 8px; margin-top: 8px; }
    .phone .app .bar.xp .fill { background: #b48cff; }
    .phone .app .job .jv { font-size: 12px; color: #7ee787; font-weight: 600; }
    .phone .app .job .ja { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .phone .app .log { font-size: 11px; opacity: .75; line-height: 1.6; }
    .phone .invest { margin-top: 10px; }
    .phone .invest .asset { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.1); }
    .phone .invest .asset .an { flex: 1 1 100%; display: flex; justify-content: space-between; }
    .phone .invest .asset .an b { color: #7ee787; }
    .phone .invest .asset .chg { opacity: .8; margin-left: 6px; }
    .phone .invest .asset .chg.neg { color: #ff8a8a; }
    .phone .invest .asset button { padding: 3px 8px; font-size: 11px; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; font: inherit; }
    .phone .invest .asset button:hover { background: rgba(126,231,135,.25); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="hud-tl">
      <div class="health"><div id="health"></div></div>
      <div class="level" id="level"><span id="level-text">Lv1</span><span class="nw" id="networth"></span><div class="xpbar"><div id="xp-fill"></div></div></div>
      <div class="clock" id="clock"></div>
      <div class="speed" id="speed"></div>
    </div>
    <div class="hud-tr">
      <div class="money" id="money">$0</div>
      <div class="stars" id="stars"></div>
      <div class="law" id="law" style="display:none"></div>
    </div>
    <div class="hud-bc"><div class="mission" id="mission" style="display:none"><div class="title" id="mission-title"></div><div id="mission-desc"></div><div class="nav" id="mission-nav" style="display:none"></div><div class="timer" id="mission-timer"></div><div class="qsub" id="mission-sub" style="display:none"></div></div></div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>
    <div class="ach" id="ach"></div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <div class="debug" id="debug"></div>
    <div class="crosshair" id="crosshair"></div>
    <div class="weapon" id="weapon">手枪 · 左键射击</div>
  </div>
  <div class="vignette" id="vignette"></div>
  <div class="panel" id="panel">
    <button class="xbtn" id="panel-close" title="关闭 (Esc)">×</button>
    <h2 id="panel-title"></h2>
    <div class="sub" id="panel-sub"></div>
    <div class="lines" id="panel-lines"></div>
    <div class="buttons" id="panel-buttons"></div>
  </div>
  <div class="phone" id="phone">
    <h2>REA PHONE</h2>
    <div class="ptime" id="phone-time"></div>
    <div class="pmoney" id="phone-money">$0</div>
    <div class="prole" id="phone-role"></div>
    <div class="plaw" id="phone-law"></div>
    <div class="bar hunger" id="phone-hunger"><span>饱食 <b></b></span><div class="track"><div class="fill"></div></div></div>
    <div class="bar energy" id="phone-energy"><span>精力 <b></b></span><div class="track"><div class="fill"></div></div></div>
    <div class="apps">
      <button data-app="work">工作</button>
      <button data-app="progress">成长</button>
      <button data-app="shop">商店</button>
      <button data-app="biz">生意</button>
      <button data-app="map">地图</button>
      <button data-app="char">角色</button>
      <button data-app="settings">设置</button>
      <button data-app="save">存档</button>
      <button data-app="load">读档</button>
      <button data-app="restart" class="danger">重新开始</button>
    </div>
    <div class="sub work" id="phone-sub-work"><h3>工作</h3><div id="phone-work"></div></div>
    <div class="sub" id="phone-sub-map"><h3>地图</h3><canvas id="phone-map" width="400" height="400"></canvas></div>
    <div class="sub" id="phone-sub-settings">
      <h3>设置</h3>
      <div class="row">时间流速 <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
      <div class="row">阴影 <button data-shadows="1">开</button><button data-shadows="0">关</button></div>
      <div class="row">音乐 <button data-music="1">开</button><button data-music="0">关</button></div>
    </div>
    <div class="tip">Tab 关闭手机 · E 与地点交互 · F 上下车</div>
  </div>
  <div class="overlay" id="overlay">
    <h1 id="ov-title">REA CITY</h1>
    <p id="ov-sub">程序生成的开放城市 · 偷车、飙车、躲警察、做任务</p>
    <div class="keys" id="ov-keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>移动 / 驾驶</span>
      <span><kbd>Shift</kbd></span><span>奔跑</span>
      <span><kbd>Space</kbd></span><span>跳跃 / 手刹漂移</span>
      <span><kbd>F</kbd></span><span>上车 / 下车</span>
      <span><kbd>E</kbd></span><span>进入地点（小贩中心 / 地铁 / 家…）</span>
      <span><kbd>Tab</kbd></span><span>手机（状态 / 地图 / 设置 / 存档）</span>
      <span><kbd>M</kbd></span><span>任务提示</span>
      <span><kbd>Tab</kbd>→工作</span><span>开工 / 下班 / 投资</span>
      <span><kbd>Enter</kbd></span><span>切换全屏</span>
      <span><kbd>鼠标</kbd></span><span>转动视角（点击画面锁定，Esc 解锁）</span>
    </div>
    <div class="go" id="ov-go">按任意键或点击开始</div>
    <div class="attrib" id="ov-attrib" style="display:none"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
