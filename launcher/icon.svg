      <rect x="350" y="380" width="170" height="350"/><rect x="540" y="200" width="130" height="530"/>
      <rect x="690" y="420" width="110" height="310"/><rect x="820" y="300" width="180" height="430"/>
    </g>
    <g fill="#8fb4ff" opacity=".55">
      <rect x="70" y="360" width="30" height="40"/><rect x="130" y="360" width="30" height="40"/><rect x="70" y="440" width="30" height="40"/><rect x="130" y="440" width="30" height="40"/>
      <rect x="240" y="290" width="28" height="40"/><rect x="290" y="290" width="28" height="40"/><rect x="240" y="370" width="28" height="40"/><rect x="290" y="370" width="28" height="40"/><rect x="240" y="450" width="28" height="40"/>
      <rect x="570" y="240" width="30" height="40"/><rect x="620" y="240" width="30" height="40"/><rect x="570" y="320" width="30" height="40"/><rect x="620" y="320" width="30" height="40"/><rect x="570" y="400" width="30" height="40"/><rect x="620" y="400" width="30" height="40"/>
      <rect x="850" y="340" width="34" height="44"/><rect x="920" y="340" width="34" height="44"/><rect x="850" y="430" width="34" height="44"/><rect x="920" y="430" width="34" height="44"/>
    </g>
    <!-- 路面 -->
    <rect x="0" y="720" width="1024" height="304" fill="#2f2f36"/>
    <rect x="0" y="705" width="1024" height="22" fill="#9a9a96"/>
    <g fill="#f1c232"><rect x="40" y="860" width="110" height="14"/><rect x="230" y="860" width="110" height="14"/><rect x="420" y="860" width="110" height="14"/><rect x="610" y="860" width="110" height="14"/><rect x="800" y="860" width="110" height="14"/></g>
    <!-- 警车（后） -->
    <g transform="translate(560 740) skewX(-8)">
