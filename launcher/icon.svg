      <rect x="70" y="0" width="150" height="50" rx="10" fill="#1c2733"/>
      <rect x="0" y="62" width="300" height="14" fill="#1e4fd8"/>
      <rect x="110" y="-20" width="34" height="18" rx="4" fill="#ff2a2a"/><rect x="146" y="-20" width="34" height="18" rx="4" fill="#2a7bff"/>
      <circle cx="60" cy="112" r="28" fill="#111"/><circle cx="240" cy="112" r="28" fill="#111"/>
    </g>
