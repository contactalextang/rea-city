<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a5e"/><stop offset=".55" stop-color="#d9532b"/><stop offset="1" stop-color="#f6b23a"/>
    </linearGradient>
    <clipPath id="r"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="760" cy="300" r="120" fill="#ffd56b" opacity=".9"/>
    <!-- 楼群 -->
    <g fill="#3a3550">
