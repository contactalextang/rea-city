      <rect x="0" y="50" width="420" height="100" rx="14" fill="#f5b400"/>
      <rect x="100" y="0" width="210" height="64" rx="12" fill="#1c2733"/>
      <rect x="395" y="70" width="25" height="22" rx="4" fill="#fff2b0"/>
