#
# REA City 定制 OSM 驱动配置（基于 GDAL 3.7 默认 share/gdal/osmconf.ini 精简修改）
# 用法：ogr2ogr ... -oo CONFIG_FILE=scripts/geo/osmconf.ini
#
# 目标：points / lines / multipolygons 三个图层都把游戏需要的 OSM key 暴露成独立字段，
# 其余 tag 仍保留在 other_tags（hstore 文本）里；关闭 osm_version/timestamp/uid/user/changeset
# 与 z_order 等不需要的字段。
#

# 闭合 way 视为面的 key（默认值）
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform

# 保留原始 key 名（不要把 ':' 改成 '_'），这样字段名是 lanes:forward / building:levels 等
attribute_name_laundering=no

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=highway,name,lanes,lanes:forward,lanes:backward,oneway,maxspeed,junction,layer,tunnel,bridge,crossing,railway,amenity,building,building:levels,height,addr:housenumber,addr:street,addr:postcode,landuse,leisure,natural,shop,public_transport
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=highway,name,lanes,lanes:forward,lanes:backward,oneway,maxspeed,junction,layer,tunnel,bridge,crossing,railway,amenity,building,building:levels,height,addr:housenumber,addr:street,addr:postcode,landuse,leisure,natural,shop,public_transport
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=highway,name,lanes,lanes:forward,lanes:backward,oneway,maxspeed,junction,layer,tunnel,bridge,crossing,railway,amenity,building,building:levels,height,addr:housenumber,addr:street,addr:postcode,landuse,leisure,natural,shop,public_transport
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
